<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bella - Pawtopia</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link rel="stylesheet" href="Petshop.css"> 
        <link rel="stylesheet" href="Petshop.js">
    </head>
    <body>
        <header class="navbar">
            <div class="logo">
                <a href="Branda.html" class="btn-back">← <i class="fa-solid fa-paw"></i>Pawtopia</a>
            </div>
            <nav>
                <a href="Bella.html" class="active"></a>
            </nav>
        </header>
        <main>
            <section class="pet-profile">
                <img src="Bella.jpe" alt="Rabbit Mix">
                <div class="pet-info">
                    <p class="match">75% Match</p>
                    <p class="location">Medan</p>
                    <h3>RABBIT MIX</h3>
                    <p class="size">Small</p>
                    <h2>Bella</h2>

                    <div class="traits">
                        <p>Energy Level <span>65%</span></p>
                        <div class="bar"><div class="fill" style="width:65%"></div></div>
                        <p>Cuddle Factor <span>60%</span></p>
                        <div class="bar"><div class="fill" style="width:60%"></div></div>
                    </div>

                    <div class="routine">
                        <h4>A Day in the Life</h4>
                        <ul>
                            <li>6:00 AM - Breakfast Time</li>
                            <li>10:00 AM - Hop Around & Binkies</li>
                            <li>1:00 PM - Nap in a Cozy Corner</li>
                            <li>5:00 PM - Snack Time</li>
                            <li>8:00 PM - Gentle Cuddles</li>
                        </ul>
                    </div>
                
                    <a href="adop.html" class="btn-adopt">Adopt Me Now</a>
                    <a href="cart.html" class="btn-cart" id="addCart"><i class="fa-solid fa-cart-shopping">Add To Cart</i></a>
                </div>
                <script src="Petshop.js">
                </script>
            </section>
        </main>
    </body>
</html>
