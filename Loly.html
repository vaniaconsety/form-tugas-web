<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Loly - Pawtopia</title>
         <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link rel="stylesheet" href="Petshop.css"> 
        <link rel="stylesheet" href="Petshop.js">
    </head>
    <body>
        <header class="navbar">
            <div class="logo">
                <a href="Branda.html" class="btn-back">← <i class="fa-solid fa-paw"></i>Pawtopia</a>
            </div>
            <nav>
                <a href="Loly.html" class="active"></a>
            </nav>
        </header>
        <main>
            <section class="pet-profile">
                <img src="Loly.jpe" alt="Cornish Rex">
                <div class="pet-info">
                    <p class="match">77% Match</p>
                    <p class="location">Medan</p>
                    <h3>CHORNISH REX</h3>
                    <p class="size">Medium</p>
                    <h2>Loly</h2>

                    <div class="traits">

                            <li>7:00 AM - Morning Zoomies</li>

                        </ul>

                    <a href="adop.html" class="btn-adopt">Adopt Me Now</a>

                </div>
                <script src="Petshop.js">
                </script>
            </section>
        </main>
